spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Behind the Azure Container Apps ingress proxy: trust X-Forwarded-* so the app
# sees the real https scheme / external host.
server.forward-headers-strategy=framework

# Health probes for Container Apps (liveness/readiness).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# One-time demo data seed. Set the env var APP_SEED_DEMO_DATA=true for the first
# boot against an empty database, then remove it. Never wipes existing rows.
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}
